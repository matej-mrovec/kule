apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: koulovana
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: koulovana.example.com   # uprav na svůj hostname v Rancheru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: koulovana
                port:
                  number: 80
